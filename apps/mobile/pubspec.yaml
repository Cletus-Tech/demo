name: young_learners_tutorial
description: Young Learners Tutorial cross-platform learning and centre management app.
publish_to: "none"
version: 0.1.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  supabase_flutter: 2.10.3
  url_launcher: ^6.3.2
  flutter_svg: ^2.0.10+1
  file_picker: 8.1.7
  shared_preferences: 2.5.3
  pdf: ^3.11.3
  printing: ^5.14.2
  excel: ^4.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  shared_preferences: 2.5.3
flutter:
  uses-material-design: true
  assets:
    - assets/young_learners_logo.svg
    - assets/classroom_hero.svg
