name: Young Learners Android APK
# Re-run after adding mocked SharedPreferences to the Supabase widget test.

on:
  workflow_dispatch:
  push:
    branches: [young-learners-foundation]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: flutter create . --platforms=android
      - name: Ensure release app has internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />'
          if permission not in content:
              content = content.replace('<application', permission + '\\n    <application', 1)
          manifest.write_text(content)
          assert 'android.permission.INTERNET' in manifest.read_text()
          print("Verified INTERNET permission in main (release) manifest")
          PY
      - name: Resolve packages
        run: flutter pub get
      - name: Run tests
        run: flutter test
      - name: Build optimised release APKs
        run: flutter build apk --release --split-per-abi --dart-define=SUPABASE_URL=https://lvpetmhhspuagbjojlks.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_M3WhhESOhd7QrrHQA9gsig_yAp607GB
      - name: Upload architecture-specific APKs
        uses: actions/upload-artifact@v4
        with:
          name: young-learners-tutorial-android-release-apks
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/mobile/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 14
