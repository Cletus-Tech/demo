name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [young-learners-foundation]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform scaffolding
        run: flutter create . --platforms=android
      - name: Resolve packages
        run: flutter pub get
      - name: Run tests
        run: flutter test
      - name: Build review APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: young-learners-tutorial-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
