name: Laravel conversion checks

on:
  push:
    branches:
      - laravel-conversion-from-original-demo
    paths:
      - "laravel-app/**"
      - ".github/workflows/laravel-conversion-checks.yml"
  pull_request:
    branches:
      - laravel-conversion-from-original-demo
    paths:
      - "laravel-app/**"

jobs:
  laravel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel-app
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare SQLite database
        run: |
          touch database/database.sqlite
          cp .env.example .env
          php artisan key:generate
      - name: Run database migrations
        run: php artisan migrate --force
      - name: Run Laravel feature tests
        run: vendor/bin/phpunit
      - name: Verify registered routes
        run: php artisan route:list
      - name: Check browser adapter syntax
        run: node --check public/js/broker-api.js
      - name: Check inline dashboard syntax
        run: node scripts/check-dashboard-script.cjs

  mysql-migrations:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: demo_broker
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: laravel-app
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: demo_broker
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Verify MySQL 8 migrations
        run: php artisan migrate --force
