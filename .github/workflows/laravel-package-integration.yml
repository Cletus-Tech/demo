name: Laravel package integration tests

on:
  push:
    branches:
      - laravel-native-starter
    paths:
      - "laravel-app/**"
      - ".github/workflows/laravel-package-integration.yml"
  pull_request:
    branches:
      - laravel-native-starter
    paths:
      - "laravel-app/**"
      - ".github/workflows/laravel-package-integration.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: ["12.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Create a disposable Laravel host
        run: composer create-project --prefer-dist "laravel/laravel:^${{ matrix.laravel }}" "$RUNNER_TEMP/broker-host" --no-interaction

      - name: Install Sanctum and merge the package
        run: |
          cd "$RUNNER_TEMP/broker-host"
          touch database/database.sqlite
          export APP_ENV=testing
          export DB_CONNECTION=sqlite
          export DB_DATABASE=database/database.sqlite
          php artisan key:generate --force
          php artisan install:api --no-interaction

          cp -R "$GITHUB_WORKSPACE/laravel-app/app/Http/Controllers/." app/Http/Controllers/
          cp -R "$GITHUB_WORKSPACE/laravel-app/app/Http/Middleware/." app/Http/Middleware/
          cp -R "$GITHUB_WORKSPACE/laravel-app/app/Models/." app/Models/
          cp -R "$GITHUB_WORKSPACE/laravel-app/database/migrations/." database/migrations/
          mkdir -p database/seeders
          cp -R "$GITHUB_WORKSPACE/laravel-app/database/seeders/." database/seeders/
          cp -R "$GITHUB_WORKSPACE/laravel-app/resources/views/." resources/views/
          mkdir -p public/js tests/Feature
          cp -R "$GITHUB_WORKSPACE/laravel-app/public/js/." public/js/
          cp "$GITHUB_WORKSPACE/laravel-app/routes/web.php" routes/web.php
          cp "$GITHUB_WORKSPACE/laravel-app/routes/api.php" routes/api.php
          cp "$GITHUB_WORKSPACE/laravel-app/tests/Feature/BrokerApiTest.php" tests/Feature/
          rm -f tests/Feature/ExampleTest.php

          python - <<'PY'
          from pathlib import Path
          path = Path("bootstrap/app.php")
          source = path.read_text()
          if "statefulApi()" not in source:
              marker = "->withMiddleware(function (Middleware $middleware): void {"
              if marker not in source:
                  raise SystemExit("Could not locate Laravel middleware configuration")
              source = source.replace(marker, marker + "\n            $middleware->statefulApi();", 1)
              path.write_text(source)
          PY

          php artisan view:cache
          php artisan route:list --except-vendor
          php artisan migrate --force
          php artisan db:seed --class='Database\\Seeders\\BrokerDemoSeeder' --no-interaction
          php artisan test
