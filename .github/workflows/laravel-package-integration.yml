name: Laravel package integration tests

on:
  push:
    branches:
      - laravel-native-starter
    paths:
      - "laravel-app/**"
      - ".github/workflows/laravel-package-integration.yml"
  pull_request:
    branches:
      - laravel-native-starter
    paths:
      - "laravel-app/**"
      - ".github/workflows/laravel-package-integration.yml"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Create a disposable Laravel host and install the package
        run: |
          composer create-project "laravel/laravel:^12.0" "$RUNNER_TEMP/broker-host" --no-interaction --prefer-dist
          cd "$RUNNER_TEMP/broker-host"
          php artisan install:api --no-interaction

          cp -R "$GITHUB_WORKSPACE/laravel-app/app/Http/Controllers/." app/Http/Controllers/
          cp -R "$GITHUB_WORKSPACE/laravel-app/app/Http/Middleware/." app/Http/Middleware/
          cp -R "$GITHUB_WORKSPACE/laravel-app/app/Models/." app/Models/
          cp -R "$GITHUB_WORKSPACE/laravel-app/database/migrations/." database/migrations/
          cp -R "$GITHUB_WORKSPACE/laravel-app/resources/views/." resources/views/
          mkdir -p public/js
          cp -R "$GITHUB_WORKSPACE/laravel-app/public/js/." public/js/
          cp "$GITHUB_WORKSPACE/laravel-app/routes/web.php" routes/web.php
          cp "$GITHUB_WORKSPACE/laravel-app/routes/api.php" routes/api.php
          mkdir -p tests/Feature
          cp -R "$GITHUB_WORKSPACE/laravel-app/tests/Feature/." tests/Feature/
          rm -f tests/Feature/ExampleTest.php

          python - <<'PY'
          from pathlib import Path
          path = Path("bootstrap/app.php")
          source = path.read_text()
          if "statefulApi()" not in source:
              marker = "->withMiddleware(function (Middleware $middleware): void {"
              if marker not in source:
                  raise SystemExit("Could not locate Laravel middleware configuration")
              source = source.replace(marker, marker + "\n            $middleware->statefulApi();", 1)
              path.write_text(source)
          PY

          php artisan key:generate --force

      - name: Run Laravel package feature tests
        working-directory: ${{ runner.temp }}/broker-host
        run: php artisan test
