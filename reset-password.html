<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset password</title><style>
:root{--bg:#07090c;--panel:#0d1014;--line:#1a1f26;--text:#f2f5f8;--mute:#8b94a1;--blue:#2d9cff;--green:#0fb58a;--red:#c0392b;--r:14px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:grid;place-items:center;padding:20px}
.box{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mute);font-size:13px;margin:0 0 16px}
.demo{background:#1a2230;border:1px solid #27405f;color:#9cc7f5;border-radius:10px;padding:8px 10px;font-size:12.5px;margin-bottom:16px}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1;background:none;border:1px solid var(--line);color:var(--mute);padding:9px;border-radius:10px;cursor:pointer;font:inherit}
.tabs button.on{border-color:var(--blue);color:var(--text)}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input{width:100%;background:#07090c;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);font:inherit}
input:focus{outline:none;border-color:var(--blue)}
.btn{width:100%;margin-top:16px;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.msg{min-height:20px;margin-top:12px;font-size:13px}.err{color:#ff7b6b}.okm{color:var(--green)}
a{color:var(--blue)}
</style></head><body>
<div class="box">
 <h1>Choose a new password</h1>
 <p class="sub">Open this page from the link in your reset email.</p>
 <label for="p1">New password</label><input id="p1" type="password" autocomplete="new-password">
 <label for="p2">Confirm new password</label><input id="p2" type="password" autocomplete="new-password">
 <button class="btn" id="go" type="button">Update password</button>
 <div class="msg" id="msg" role="status"></div>
 <div class="sub"><a href="login.html">Back to sign in</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="supabase-client.js"></script>
<script>
(function(){
 var S=window.AppSupabase,$=function(i){return document.getElementById(i)};
 function say(t,ok){$("msg").textContent=t;$("msg").className="msg "+(ok?"okm":"err")}
 if(!S||!S.ready){say(S?S.problem:"Setup problem.");$("go").disabled=true;return}
 $("go").onclick=async function(){
  var a=$("p1").value;
  if(a.length<8){say("Use a password of at least 8 characters.");return}
  if(a!==$("p2").value){say("The two passwords do not match.");return}
  var s=await S.client.auth.getSession();
  if(!s.data.session){say("This link has expired or was already used. Request a new reset email.");return}
  var r=await S.client.auth.updateUser({password:a});
  if(r.error){say(r.error.message);return}
  say("Password updated. Redirecting…",true);setTimeout(function(){location.replace("dashboard.html")},900);
 };
})();
</script></body></html>
